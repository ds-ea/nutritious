import groovy.json.JsonSlurper

def getBuildVersion() {
    def inputFile = new File("$rootDir/../.buildversion.json")
    def versionData = new JsonSlurper().parseText(inputFile.text)
	return versionData
}
def versionData = getBuildVersion()

ext {
    // Capacitor 8's floor is 24; we deliberately stay at 29, which is what this app has
    // always shipped. Everything else tracks the Capacitor 8 template.
    minSdkVersion = 29
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'

    nutritiousBuild = versionData.build
	nutritiousVersion = versionData.version
}
