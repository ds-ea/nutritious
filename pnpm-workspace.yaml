packages:
  - 'apps/*'
  - '!apps/admin-remix'
  - '!apps/adminjs'
  - '!apps/adminjs-e2e'
  - '!apps/nutritious-api-php'
  - 'libs/*'
  - '!**/test/**'
  - '!dist/**'
allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  bcrypt: true
  cypress: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
